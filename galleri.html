<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="icon" href="./imgs/favicon.ico">

</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="./imgs/logopng.webp" alt="Logo">
            </a>
        </div>

        <div class="burger">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </div>

        <nav>
            <ul class="menu">
                <li><a href="index.html">Forside</a></li>

                <li><a href="find_shop.html">Find KBH shops</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="startimg">
                <img src="./imgs/galleri_img.webp" alt="info_icon">
            </div>
            <h1>Galleri</h1>

            <div class="knap1">
                <a href="#flash" class="button">Flash</a>
                <a href="#tattoo" class="button">Tattoo</a>
                <a href="#shops" class="button">Shops</a>
            </div>
        </section>

        <!-- Sektion 1: Flash -->
        <section class="galleri_flash" id="flash">
            <h2>Flash</h2>
            <div class="grid_galleri">
                <img src="./imgs/galleribilleder/flash1-2.webp" alt="flash1">
                <img src="./imgs/galleribilleder/flash2.webp" alt="Flash 2">
                <img src="./imgs/galleribilleder/flash3.webp" alt="Flash 3">
                <img src="./imgs/galleribilleder/flash4.webp" alt="Flash 4">
                <img src="./imgs/galleribilleder/flash5.webp" alt="Flash 5">
                <img src="./imgs/galleribilleder/flash6.webp" alt="Flash 6">
            </div>
        </section>

        <!-- Sektion 2: Tattoo -->
        <section class="galleri_tattoo" id="tattoo">
            <h2>Tattoo</h2>
            <div class="grid_galleri">
                <img src="./imgs/galleribilleder/tattoo1.webp" alt="Tattoo 1">
                <img src="./imgs/galleribilleder/tattoo2.webp" alt="Tattoo 2">
                <img src="./imgs/galleribilleder/tattoo3.webp" alt="Tattoo 3">
                <img src="./imgs/galleribilleder/tattoo4.webp" alt="Tattoo 4">
                <img src="./imgs/galleribilleder/tattoo5.webp" alt="Tattoo 5">
                <img src="./imgs/galleribilleder/tattoo6.png" alt="Tattoo 6">
            </div>
        </section>

        <!-- Sektion 3: Shops -->
        <section class="galleri_shops" id="shops">
            <h2>Shops</h2>
            <div class="grid_galleri">
                <img src="./imgs/galleribilleder/shop1.webp" alt="Shop 1">
                <img src="./imgs/galleribilleder/shop2.png" alt="Shop 2">
                <img src="./imgs/galleribilleder/shop3.webp" alt="Shop 3">
                <img src="./imgs/galleribilleder/shop4.webp" alt="Shop 4">
                <img src="./imgs/galleribilleder/shop5.png" alt="Shop 5">
                <img src="./imgs/galleribilleder/shop6.png" alt="Shop 6">
            </div>
        </section>
